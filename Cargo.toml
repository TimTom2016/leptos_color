[workspace]
members = [".", "examples/basic-ssr"]


[package]
name = "leptos_color"
version = "0.8.0"
edition = "2024"
license = "MIT"
authors = ["Tim Persigehl <dev@timtom2016.com>"]
description = "Leptos Color is a simple Crate that gives access to a color picker for leptos"
documentation = "https://docs.rs/leptos_color/latest/"
repository = "https://github.com/TimTom2016/leptos_color"
keywords = ["leptos", "color", "picker"]
categories = ["wasm", "web-programming", "visualization"]
readme = "README.md"

[dependencies]
leptos = "0.8.0"
leptos-use = { version = "0.17.0", default-features = false, features = [
    "use_css_var",
    "use_event_listener",
] }
web-sys = { version = "0.3.70", features = [
    "DomRect",
    "Element",
    "TouchEvent",
    "TouchEventInit",
    "TouchList",
    "Touch",
    "TouchInit",
] }
csscolorparser = "0.8.0"
floating-ui-leptos = { version = "0.6.0", optional = true }
send_wrapper = { version = "0.6.0", optional = true }
leptos-node-ref = { version = "0.2.0", optional = true }
leptos_styling = { version = "0.3.0" }

[features]
default = ["color_input"]
csr = []
ssr = ["leptos-use/ssr", "leptos_styling/ssr"]
hydrate = ["leptos/hydrate"]
color_input = [
    "dep:floating-ui-leptos",
    "dep:send_wrapper",
    "dep:leptos-node-ref",
]
